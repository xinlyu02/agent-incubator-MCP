# ─────────────────────────────────────────────────────────────────────────────
# After deploying, create a Destination in BTP Cockpit:
#   Name:                agent-incubator-mcp
#   URL:                 https://agent-incubator-mcp.cfapps.eu12.hana.ondemand.com
#   Authentication:      OAuth2JWTBearer  (forwards the Joule user token)
#   Additional Property: sap-joule-studio-mcp-server = true  ← required for Joule Work Desktop
# ─────────────────────────────────────────────────────────────────────────────
---
applications:
  - name: agent-incubator-mcp
    memory: 256M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: node dist/server.js
    routes:
      - route: agent-incubator-mcp.cfapps.eu12.hana.ondemand.com

    env:
      NODE_ENV: production
      AUTH_MODE: passthrough
      INCUBATOR_BASE_URL: https://coe-gc-shared-hanacloud-dev-afc-srv.cfapps.eu12.hana.ondemand.com